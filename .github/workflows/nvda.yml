name: Native NVDA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Native acceptance suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: nvda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: NVDA (${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'full' }})
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NVDA_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'full' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install firefox
      - name: Prepare NVDA
        uses: guidepup/setup-action@0.21.0
      - name: Run native suite
        run: pnpm run "test:screen-reader:${{ env.NVDA_SUITE }}"
