name: Native NVDA

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native acceptance suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: nvda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install firefox
      - name: Prepare NVDA
        uses: guidepup/setup-action@0.21.0
      - run: pnpm test:screen-reader:smoke

  full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install firefox
      - name: Prepare NVDA
        uses: guidepup/setup-action@0.21.0
      - run: pnpm test:screen-reader:full
